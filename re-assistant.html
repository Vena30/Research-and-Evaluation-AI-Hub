<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaxAce R&E AI Assistant — Live</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f4f0; --surface: #ffffff; --surface-alt: #f1efe8;
    --border: rgba(0,0,0,0.1); --border-strong: rgba(0,0,0,0.18);
    --text-primary: #1a1a18; --text-secondary: #5f5e5a; --text-muted: #888780;
    --accent-bg: #e6f1fb; --accent-text: #185fa5; --accent-border: #85b7eb;
    --warning-bg: #faeeda; --warning-text: #854f0b;
    --danger-bg: #fcebeb; --danger-text: #a32d2d;
    --teal: #0f6e56; --teal-bg: #e1f5ee; --teal-dark: #085041;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a18; --surface: #2c2c2a; --surface-alt: #242422;
      --border: rgba(255,255,255,0.08); --border-strong: rgba(255,255,255,0.14);
      --text-primary: #e8e6de; --text-secondary: #9c9a92; --text-muted: #5f5e5a;
      --accent-bg: #0c447c; --accent-text: #b5d4f4; --accent-border: #185fa5;
      --warning-bg: #633806; --warning-text: #fac775;
      --danger-bg: #791f1f; --danger-text: #f7c1c1;
      --teal: #5dcaa5; --teal-bg: #04342c; --teal-dark: #9fe1cb;
    }
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text-primary);
    min-height: 100vh; padding: 2rem 1rem; line-height: 1.6;
  }
  .container { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 1.5rem; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .logo-mark {
    width: 32px; height: 32px; border-radius: 8px; background: var(--teal);
    display: flex; align-items: center; justify-content: center; color: #fff;
    font-weight: 700; font-size: 15px; letter-spacing: -0.5px; flex-shrink: 0;
  }
  h1 { font-size: 18px; font-weight: 500; }
  .subtitle { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .notice {
    background: var(--warning-bg); color: var(--warning-text); border-radius: var(--radius);
    padding: 10px 14px; font-size: 12px; margin-bottom: 1.25rem; line-height: 1.5;
  }
  .card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 12px; padding: 1.25rem; margin-bottom: 1rem;
  }
  label { font-size: 13px; color: var(--text-secondary); display: block; margin-bottom: 8px; }
  select, textarea {
    width: 100%; padding: 10px 14px; border-radius: var(--radius);
    border: 0.5px solid var(--border-strong); background: var(--surface-alt);
    font-size: 14px; color: var(--text-primary); font-family: inherit; line-height: 1.5;
  }
  textarea { resize: none; }
  textarea:focus, select:focus { outline: none; border-color: var(--accent-border); }
  .field { margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; margin-bottom: 4px; }
  .chip {
    display: inline-block; padding: 6px 12px; border-radius: 20px;
    border: 0.5px solid var(--border-strong); font-size: 13px;
    color: var(--text-secondary); cursor: pointer; background: var(--surface-alt);
    transition: all 0.15s; user-select: none;
  }
  .chip:hover, .chip.active { background: var(--accent-bg); color: var(--accent-text); border-color: var(--accent-border); }
  .send-row { display: flex; gap: 8px; margin-top: 12px; align-items: flex-start; }
  .send-btn {
    display: inline-flex; align-items: center; gap: 7px; padding: 9px 18px;
    border-radius: var(--radius); border: 0.5px solid var(--border-strong);
    background: var(--teal); color: #fff; font-size: 13px; cursor: pointer;
    transition: all 0.15s; font-family: inherit; white-space: nowrap;
  }
  .send-btn:hover { background: #0d5e49; }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .thread { display: flex; flex-direction: column; gap: 12px; margin-top: 1rem; }
  .msg { padding: 12px 14px; border-radius: 12px; font-size: 13px; line-height: 1.6; }
  .msg-user { background: var(--accent-bg); color: var(--accent-text); align-self: flex-end; max-width: 85%; }
  .msg-assistant { background: var(--surface-alt); border: 0.5px solid var(--border); max-width: 100%; white-space: pre-wrap; }
  .msg-label { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
  .msg-error { background: var(--danger-bg); color: var(--danger-text); }
  .loading { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-muted); padding: 8px 0; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--text-muted); animation: pulse 1.2s infinite ease-in-out; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes pulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
  .active-specialist {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; color: var(--teal-dark); background: var(--teal-bg);
    padding: 8px 12px; border-radius: var(--radius); margin-bottom: 10px;
  }
  .reset-link { font-size: 12px; color: var(--text-muted); cursor: pointer; text-decoration: underline; background: none; border: none; font-family: inherit; }
  .fallback-link { font-size: 12px; color: var(--accent-text); margin-top: 10px; display: inline-block; }
  footer { margin-top: 2rem; font-size: 12px; color: var(--text-muted); text-align: center; padding-bottom: 2rem; }
</style>
</head>
<body>
<div class="container">

  <header>
    <div class="logo-row">
      <div class="logo-mark">TA</div>
      <h1>R&amp;E AI Assistant — Live</h1>
    </div>
    <p class="subtitle">TaxAce Group Inc. · Research &amp; Evaluation Lead</p>
  </header>

  <p class="notice" id="mode-notice">Calls Claude directly — no copy/paste needed.</p>

  <div class="card">
    <div id="active-specialist-row"></div>
    <label for="specialist-select">Specialist</label>
    <div class="field">
      <select id="specialist-select"></select>
    </div>
    <label for="task-input">What do you need?</label>
    <div class="field">
      <textarea id="task-input" rows="3" placeholder="Describe your task..."></textarea>
    </div>
    <div class="send-row">
      <button class="send-btn" id="send-btn">Send</button>
    </div>
  </div>

  <div class="thread" id="thread"></div>

  <footer>TaxAce Group Inc. · R&amp;E AI Assistant · Live specialist calls</footer>

</div>

<script>
const DOSSIER_RULE = "TaxAce operating rule: AI drafts, humans decide. Never finalize a filing, compliance decision, or client communication. Always state clearly that a human at TaxAce must review this before it is used, shared, or acted on. Keep responses practical and specific to TaxAce Group Inc., a tax and accounting firm.";

const specialists = {
  "TaxAce Intelligence": {
    system: DOSSIER_RULE + " You are TaxAce Intelligence, the first-stop specialist for TaxAce Group Inc.'s Research & Evaluation function. Answer questions about TaxAce's internal operations and the outside world clearly and honestly, and when the answer isn't available, flag it immediately and route to the right specialist or person instead of guessing.\n\nSTEP 1 - Classify the question as one of three types:\nInternal - the answer lives inside TaxAce: a process, policy, system, team member's role, standard, or past decision.\nExternal - the answer lives outside TaxAce: a tax concept, regulatory rule, AI tool, industry trend, or general business/technology question.\nMixed - requires both.\n\nSTEP 2 - Answer by type:\nExternal: answer directly using available knowledge. Flag anything that may have changed recently or needs verification, and note your knowledge cutoff where relevant.\nInternal: IMPORTANT - in this live tool you have no access to TaxAce's dossier or uploaded reference documents, and no conversation context beyond what the user just told you. Treat internal TaxAce facts (process steps, policy thresholds, team structures, system specifics) as NOT confirmed unless the user has explicitly stated them in this conversation. Do not reconstruct or infer TaxAce-internal facts from general knowledge - flag and route instead.\nMixed: answer the external part directly, apply the internal rule above to the internal part.\n\nSTEP 3 - When the answer to an internal question is not available, do not guess. State clearly that it's not available from current sources, identify exactly what's missing, and route using this guide:\nA specific AI tool (new, proposed, under consideration) -> AI Tool Evaluator\nTaxAce's full tech stack, subscriptions, or spend -> AI + Tech Stack Optimization Evaluator\nExternal research, market trends, competitor info -> Research Specialist\nTaxAce's own data, metrics, or evaluation results -> Report Writer\nA confirmed result or outcome worth documenting -> Case Study Writer\nA prompt's quality before deployment -> Prompt QA Reviewer\nWhether an adopted tool or workflow is working -> Adoption Check\nAn artifact before it goes to Carissa for QA -> Artifact QA Specialist\nAny output needing accuracy verification -> Accuracy Validator\nTaxAce processes, policies, or artifact standards -> Carissa Gutierrez (QA / PM)\nClient data, Canopy records, or filing status -> the Canopy system or assigned Tax Reviewer\nHR, team, or personnel matters -> Hazel (HR Manager)\nBudget, financial decisions, or vendor contracts -> Joe Zamora (CFO)\nFinal approval on any artifact or major decision -> Nataly Zamora (CEO) or Ivy (COO)\nTax prep workflow specifics -> Amber (Tax Prep Manager / Process Owner)\n\nFORMAT YOUR ANSWER AS:\nAnswer - the response, stated plainly, no unnecessary preamble.\nConfidence level - Confirmed (sourced from something the user gave you in this conversation), Reliable (established general knowledge, verify before high-stakes use), or Unverified (not available from confirmed sources - see routing).\nSource or basis - what the answer is based on.\nFlag and route - only if Unverified. Name a specific specialist or person, never a vague 'check with the team.'\nFollow-up - optional, only if the question hints at a deeper decision or task.\n\nKeep answers as short as the question allows. Never state an internal TaxAce fact as Confirmed unless the user actually gave you that information in this conversation. Never reproduce or reconstruct client data - redirect to Canopy instead.",
    starter: "Ask anything — a TaxAce process, a tax concept, an AI tool, industry standards, or a business decision."
  },
  "AI Tool Evaluator": {
    system: DOSSIER_RULE + " You are the AI Tool Evaluator for TaxAce's Research & Evaluation function. Job: assess one AI tool against TaxAce's standards and return an adopt, improve, or reject recommendation. Call this when a new AI tool, model, or vendor solution needs evaluation before TaxAce commits to it.",
    starter: "Help me run a tool evaluation. Walk me through what you need from me to get started."
  },
  "Research Specialist": {
    system: DOSSIER_RULE + " You are the Research Specialist for TaxAce's Research & Evaluation function. Job: gather and summarize what TaxAce needs to know about a topic, market, or competitor as a structured summary organized by theme. Call this when the answer is out in the world — research, market updates, competitor checks, or outside information.",
    starter: "I need to research market alternatives to a tool TaxAce currently uses. Help me structure the research."
  },
  "Report Writer": {
    system: DOSSIER_RULE + " You are the Report Writer for TaxAce's Research & Evaluation function. Job: turn TaxAce's internal data and findings into a plain-English, executive-ready report that explains what changed, why it matters, and what to do next. Call this when the answer is in TaxAce's own data — evaluation scores, metrics, survey results, or internal findings.",
    starter: "I have evaluation findings ready. Help me write a leadership-ready report in TaxAce's voice."
  },
  "Case Study Writer": {
    system: DOSSIER_RULE + " You are the Case Study Writer for TaxAce's Research & Evaluation function. Job: turn one confirmed result from an AI initiative or workflow change into a structured evidence document that captures what happened and what TaxAce carries forward. Call this when a result is confirmed and needs to be documented as institutional proof.",
    starter: "I have a confirmed result from an AI initiative. Help me document it as a case study."
  },
  "AI + Tech Stack Optimization Evaluator": {
    system: DOSSIER_RULE + " You are the AI + Tech Stack Optimization Evaluator for TaxAce's Research & Evaluation function. Job: review TaxAce's existing tools, subscriptions, and systems to find duplication, waste, and consolidation opportunities, and return a decision-ready cost optimization report with a recommendation for every tool. Call this for stack audits, subscription reviews, cost reduction assessments, or pre-budget clean-ups.",
    starter: "Help me run a stack audit and cost reduction pass. What inventory do you need from me first?"
  },
  "Accuracy Validator": {
    system: DOSSIER_RULE + " You are the Accuracy Validator for TaxAce's Research & Evaluation function. Job: validate the accuracy of any completed output, AI-generated or human-written, and return an accuracy score out of 10 plus a Pass or Fail verdict with every issue identified. Call this on any output before it is used, shared, approved, or acted on.",
    starter: "I have a finished output I need validated for accuracy before it goes out. What do you need from me?"
  },
  "Prompt QA Reviewer": {
    system: DOSSIER_RULE + " You are the Prompt QA Reviewer for TaxAce's Research & Evaluation function. Job: test and score a prompt against TaxAce's quality, accuracy, compliance, and operational standards, and return a Deploy, Revise, or Rebuild verdict with specific fixes. Call this before any new or revised prompt goes into active use.",
    starter: "I have a prompt I want to QA before it goes live at TaxAce. Help me test it."
  },
  "Adoption Check": {
    system: DOSSIER_RULE + " You are the Adoption Check specialist for TaxAce's Research & Evaluation function. Job: assess whether an adopted tool or workflow is being used correctly, delivering value, and worth continuing, and return a Healthy, At Risk, or Failing health status with a Continue, Adjust, or Escalate recommendation. Call this at a defined checkpoint after go-live, or when leadership asks whether something is working.",
    starter: "Help me check whether a tool TaxAce adopted is actually being used and delivering value."
  }
};

const specialistSelect = document.getElementById('specialist-select');
Object.keys(specialists).forEach(name => {
  const opt = document.createElement('option');
  opt.value = name;
  opt.textContent = name;
  specialistSelect.appendChild(opt);
});

const taskInput = document.getElementById('task-input');
const sendBtn = document.getElementById('send-btn');
const thread = document.getElementById('thread');
const activeRow = document.getElementById('active-specialist-row');

let history = [];
let currentSpecialist = null;

// Leave blank to call Claude directly — only works when this file is opened as
// a Claude artifact (inside claude.ai), since that's the only place the API key
// is handled automatically. Paste your deployed Apps Script proxy URL here once
// you've set up re-assistant-proxy.gs, and this same file works standalone too
// (e.g. hosted on GitHub Pages) — see re-assistant-proxy.gs for setup steps.
const PROXY_URL = 'https://script.google.com/macros/s/AKfycbxbyZy6kVER1kwqxo9f82BlRsarFWGh5--brkQrJX6tsZeIjPodtZrCaZzVaUpySV-V/exec';
// Must exactly match SHARED_SECRET in re-assistant-proxy.gs if you're using the proxy.
const PROXY_SECRET = 'TaxAce2026';

if (PROXY_URL) {
  document.getElementById('mode-notice').textContent =
    'Standalone mode — runs through your own backend, no claude.ai needed.';
}

function renderActiveRow() {
  if (!currentSpecialist) { activeRow.innerHTML = ''; return; }
  activeRow.innerHTML = '<div class="active-specialist"><span>Talking to: ' + currentSpecialist + '</span><button class="reset-link" id="reset-btn">Start over</button></div>';
  document.getElementById('reset-btn').addEventListener('click', resetThread);
}

function resetThread() {
  history = [];
  currentSpecialist = null;
  thread.innerHTML = '';
  taskInput.value = '';
  renderActiveRow();
}

function addMessage(role, text, isError) {
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'user' ? 'msg-user' : 'msg-assistant') + (isError ? ' msg-error' : '');
  const label = document.createElement('div');
  label.className = 'msg-label';
  label.textContent = role === 'user' ? 'You' : (isError ? 'Error' : currentSpecialist || 'Claude');
  div.appendChild(label);
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(body);
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

function addLoading() {
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading-indicator';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div><span>' + (currentSpecialist || 'Claude') + ' is working…</span>';
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

function removeLoading() {
  const el = document.getElementById('loading-indicator');
  if (el) el.remove();
}

async function sendMessage() {
  const text = taskInput.value.trim();
  if (!text) { taskInput.focus(); return; }

  const specialistName = specialistSelect.value;
  const isNewThread = currentSpecialist !== specialistName;
  if (isNewThread) {
    history = [];
    currentSpecialist = specialistName;
    renderActiveRow();
  }

  addMessage('user', text);
  history.push({ role: 'user', content: text });
  taskInput.value = '';
  sendBtn.disabled = true;
  addLoading();

  try {
    const requestBody = {
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: specialists[specialistName].system,
      messages: history
    };

    let response;
    if (PROXY_URL) {
      // Standalone mode — through your own backend, which holds the real API key.
      response = await fetch(PROXY_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" }, // avoids a CORS preflight Apps Script doesn't handle
        body: JSON.stringify({ ...requestBody, secret: PROXY_SECRET })
      });
    } else {
      // Artifact mode — Claude's own API-in-artifact handling, no key needed.
      response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(requestBody)
      });
    }

    const data = await response.json();
    removeLoading();

    if (data.error) {
      addMessage('assistant', typeof data.error === 'string' ? data.error : (data.error.message || 'The backend returned an error.'), true);
      return;
    }

    const textBlocks = (data.content || []).filter(b => b.type === 'text').map(b => b.text);
    let replyText = textBlocks.join('\n') || 'No response text returned.';
    if (data.provider === 'openai-fallback') {
      replyText = 'Claude was unavailable, so this response came from the backup AI instead — treat it as a lighter-quality stand-in.\n\n' + replyText;
    }

    addMessage('assistant', replyText);
    history.push({ role: 'assistant', content: replyText });
  } catch (err) {
    removeLoading();
    addMessage('assistant', 'Could not reach Claude just now. Try again, or use the copy/paste version of the RE Assistant instead.', true);
    console.error(err);
  } finally {
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', sendMessage);
taskInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

specialistSelect.addEventListener('change', () => {
  if (currentSpecialist && currentSpecialist !== specialistSelect.value) {
    taskInput.placeholder = 'Switching specialist will start a new thread...';
  }
});

// Pre-fill a starter prompt for the first specialist so the box isn't empty
taskInput.placeholder = specialists[specialistSelect.value].starter;
specialistSelect.addEventListener('change', () => {
  taskInput.placeholder = specialists[specialistSelect.value].starter;
});
</script>
</body>
</html>
